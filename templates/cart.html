<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1>🛒 Your Cart</h1>

{% for item in items %}

<div class="cart-card">

    <h3>{{ item.item_name }}</h3>

    <p>Price: ₹{{ item.price }}</p>


    <a href="/remove-from-cart/{{ item.id }}">
        <button class="remove-btn">
            🗑️ Remove
        </button>
    </a>

</div>

{% endfor %}

<h2>Total: ₹{{ total }}</h2>

<a href="/place-order">
    <button class="place-order-btn">
        ✅ Place Order
    </button>
</a>

</body>
</html>
