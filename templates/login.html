<!DOCTYPE html>
<html>
<head>
    <title>Login - Smart Cafe</title>

    <style>

        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#121212;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            background:#1e1e1e;
            padding:40px;
            border-radius:15px;
            width:350px;
            text-align:center;
            box-shadow:0px 0px 20px rgba(0,0,0,0.5);
        }

        h1{
            color:orange;
            margin-bottom:10px;
        }

        p{
            color:#ddd;
            margin-bottom:25px;
        }

        input{
            width:90%;
            padding:12px;
            margin:10px 0;
            border:none;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            background:orange;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            opacity:0.9;
        }

        a{
            color:orange;
            text-decoration:none;
        }

    </style>
</head>

<body>

<div class="login-box">

    <h1>☕ Smart Cafe</h1>

    <p>Login to continue ordering</p>

    <form method="POST">

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

    <br>

    <p>
        Don't have an account?
        <a href="/register">Register</a>
    </p>

</div>

</body>
</html>
